name: Household Tool
slug: household_tool
version: 0.8.0
description: Internes Haushalts-Intranet mit Projekte-App und File-Sharing.
startup: services
boot: auto
arch:
  - aarch64
  - amd64
init: false
webui: http://[HOST]:[PORT:8099]
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI
map: []
options:
  admin_username: admin
  admin_password: ""
  music_ingest_token: ""
  ha_reminders_enabled: false
  ha_base_url: ""
  ha_token: ""
  reminder_time: "09:00"
  reminder_quiet_start: "22:00"
  reminder_quiet_end: "07:00"
  reminder_max_retries: 3
  reminder_timeout: 5
schema:
  admin_username: str
  admin_password: password?
  music_ingest_token: password?
  ha_reminders_enabled: bool
  ha_base_url: str?
  ha_token: password?
  reminder_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  reminder_quiet_start: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  reminder_quiet_end: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  reminder_max_retries: "int(0,5)"
  reminder_timeout: "int(1,10)"
